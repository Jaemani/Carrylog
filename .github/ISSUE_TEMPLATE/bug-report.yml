name: Bug report
description: Report a reproducible Carrylog CLI, adapter, migration, or checkpoint defect.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        This submission creates a public GitHub issue. Remove repository names, URLs, private paths, and identifying content.
        Do not paste secrets, private repository content, raw provider transcripts, or ignored files.
        Report security-sensitive file overwrite, repository escape, or credential exposure through the private security link instead.
  - type: input
    id: version
    attributes:
      label: Carrylog version
      description: Use `carrylog --version` or the exact package version.
      placeholder: 0.1.0-beta.7
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, shell, and Git version.
      placeholder: macOS 15, Node.js 22.23.0, zsh, Git 2.50.1
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation path
      options:
        - Exact project dependency with npx --no-install
        - Global npm installation
        - One-off npx execution
        - Source checkout
        - Other
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      description: Redact project paths or values that identify private content.
      placeholder: carrylog resume --check --json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include stable error codes and sanitized diagnostics. Do not include credentials or raw transcripts.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal sanitized reproduction
      description: Describe the smallest fixture or sequence that reproduces the defect without proprietary content.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation evidence
      description: Add sanitized `carrylog validate --json`, Git state/counts without paths, or test results when relevant. State when a check was not run.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I understand this report creates a public GitHub issue and removed identifying repository names, URLs, and paths.
          required: true
        - label: I removed secrets, private repository content, raw provider transcripts, and ignored-file contents.
          required: true
        - label: This report is not a security-sensitive repository escape, overwrite, or credential-exposure issue.
          required: true
